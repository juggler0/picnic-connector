<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EDEFEA">
<title>Ons menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Albert+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --stone: #EDEFEA; --card: #FAFAF7; --ink: #1E2723; --muted: #66706B;
    --line: #D5D9D2; --brass: #93743A; --brass-soft: #E9E1CF; --danger: #9B2C2C;
    --serif: "Marcellus", Georgia, serif; --sans: "Albert Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --stone: #141917; --card: #1C2320; --ink: #E7EAE5; --muted: #9AA39E; --line: #2F3934; --brass: #C7A665; --brass-soft: #3A3324; --danger: #E79A9A; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--stone); color: var(--ink); font: 16px/1.55 var(--sans); }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 20px 16px 64px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 4px 16px; }
  header h1 { font: 400 1.6rem/1.1 var(--serif); margin: 0; letter-spacing: .02em; }
  .who { color: var(--muted); font-size: .9rem; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  .weeks { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 14px; scrollbar-width: none; }
  .weeks button { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: .9rem; cursor: pointer; color: var(--muted); }
  .weeks button.past { opacity: .7; }
  .weeks button.now { border-color: var(--brass); color: var(--brass); }
  .weeks button.next { background: var(--brass-soft); border-color: var(--brass-soft); color: var(--ink); }
  .weeks button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); opacity: 1; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 36px 22px 28px; }
  .card > h2 { font: 400 1.35rem/1.25 var(--serif); text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; color: var(--muted); font-size: .88rem; margin: 0 0 26px; }
  .ornament { width: 36px; height: 1px; background: var(--brass); margin: 0 auto; }

  .day { text-align: center; padding: 22px 0; }
  .day + .day { border-top: 1px solid var(--line); }
  .dayname { color: var(--brass); font-size: .88rem; letter-spacing: .03em; }
  .dish { font: 400 1.4rem/1.3 var(--serif); margin: 4px 0 2px; }
  .dish.empty { color: var(--muted); font-size: 1.05rem; }
  .notes { color: var(--muted); font-size: .92rem; margin: 2px 0 0; }
  .meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: .9rem; }
  .meta a, .meta button { color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
  .owner-mark { display: inline-block; font-size: .78rem; color: var(--brass); border: 1px solid var(--brass-soft); border-radius: 999px; padding: 0 8px; margin-top: 6px; }

  .panel { text-align: left; margin: 16px 0 0; padding: 16px; border-radius: 4px; background: var(--stone); }
  .panel h3 { font: 500 .95rem/1.3 var(--sans); margin: 0 0 8px; }
  .panel + .panel { margin-top: 10px; }
  .others { list-style: none; margin: 0 0 14px; padding: 0; }
  .others li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .others li:last-child { border-bottom: 0; }
  .others b { font-weight: 600; }
  .score { display: inline-block; min-width: 1.8em; text-align: center; border-radius: 999px; background: var(--brass-soft); color: var(--ink); font-weight: 600; font-size: .85rem; margin-left: 6px; }
  .muted { color: var(--muted); }
  details.ingr { margin-top: 10px; font-size: .92rem; }
  details.ingr summary { cursor: pointer; color: var(--muted); }
  details.ingr p { margin: 6px 0 0; white-space: pre-line; }

  label.f { display: block; font-size: .88rem; color: var(--muted); margin: 10px 0 4px; }
  textarea, input[type=text], input[type=url], input[type=password], input[inputmode] {
    width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px;
  }
  textarea { min-height: 72px; resize: vertical; }
  .rating { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .rating button { aspect-ratio: 1; border: 1px solid var(--line); background: var(--card); border-radius: 50%; cursor: pointer; font-size: .9rem; padding: 0; }
  .rating button[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: #fff; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .btn { border: 0; background: var(--ink); color: var(--card); border-radius: 4px; padding: 10px 18px; cursor: pointer; font-weight: 500; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: .95rem; }
  .saved { color: var(--brass); font-size: .9rem; }
  .err { color: var(--danger); font-size: .9rem; }

  .wkc { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
  .wkc h3 { font: 400 1.1rem/1.3 var(--serif); text-align: center; margin: 0 0 12px; }

  .scores { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; margin: 16px 0 4px; }
  .scores .cell { min-width: 46px; background: none; border: 0; padding: 2px 4px; border-radius: 6px; font: inherit; color: inherit; }
  .scores button.cell { cursor: pointer; }
  .scores .cell.sel small { color: var(--brass); font-weight: 600; }
  .scores button.cell.sel { outline: 1px solid var(--brass-soft); }
  .mine .for { margin: 6px 0 6px; font-size: .85rem; color: var(--muted); text-align: center; }
  .hint { color: var(--muted); font-size: .82rem; }
  .rs { color: var(--muted); }
  .rs.ok { color: var(--brass); font-weight: 600; }
  .scores small { display: block; color: var(--muted); font-size: .78rem; }
  .scores span { font: 400 1.35rem/1.2 var(--serif); }
  .scores .none { color: var(--line); }
  .scores .guest small { color: var(--brass); }
  .avg { color: var(--muted); font-size: .85rem; margin: 0; }
  .notes-list { list-style: none; margin: 10px auto 0; padding: 0; max-width: 460px; text-align: left; font-size: .93rem; }
  .notes-list li { padding: 4px 0; }
  .notes-list b { font-weight: 600; margin-right: 6px; }
  .mine { text-align: left; max-width: 460px; margin: 14px auto 0; }
  .mine .rating { margin-bottom: 8px; }
  .mine textarea { min-height: 52px; }
  .mine .row { margin-top: 8px; }
  .quota { color: var(--muted); font-size: .85rem; text-align: center; margin: 0 0 12px; }
  .cnote { color: var(--brass); font-size: .88rem; margin: 6px auto 0; max-width: 460px; }
  .groc ul { list-style: none; margin: 0 auto; padding: 0; max-width: 460px; }
  .groc li { display: block; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .groc li:last-child { border-bottom: 0; }
  .groc .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .groc .n { flex: 1; }
  .groc .pp { color: var(--muted); font-size: .86rem; margin-top: 1px; }
  .groc .tag { display: inline-block; margin-top: 4px; }
  .groc .amt { color: var(--muted); font-variant-numeric: tabular-nums; }
  .groc .tag { font-size: .78rem; color: var(--brass); border: 1px solid var(--brass-soft); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
  .groc li.no .n, .groc li.no .pp { text-decoration: line-through; color: var(--muted); }
  .groc .acts { display: flex; gap: 12px; margin-left: auto; }
  .groc .acts button { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .88rem; }
  .groc .acts button.yes { color: var(--ink); }
  .groc form { display: grid; grid-template-columns: 1fr 78px auto; gap: 8px; max-width: 460px; margin: 14px auto 0; }
  .groc form input { padding: 9px 10px; }

  .login { max-width: 380px; margin: 10vh auto 0; }
  .who-row { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .who-list > :last-child { border-bottom: 0; }
  .who-btn { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; font: 400 1.15rem/1.2 var(--serif); color: var(--ink); }
  .who-btn .go { justify-self: end; color: var(--muted); font-family: var(--sans); }
  .who-row label { font: 400 1.15rem/1.2 var(--serif); }
  .who-row input { text-align: center; letter-spacing: .3em; }
  .guest-btn { width: 100%; margin-top: 18px; }
  .login .card { padding: 36px 24px; }
  .login h1 { font: 400 1.9rem/1.1 var(--serif); text-align: center; margin: 0 0 6px; }
  .login .btn { width: 100%; margin-top: 18px; }
  .empty-state { text-align: center; color: var(--muted); padding: 30px 0 10px; }
  @media (prefers-reduced-motion: no-preference) { .panel { animation: open .18s ease-out; } @keyframes open { from { opacity: 0; transform: translateY(-4px); } } }
</style>
</head>
<body>
<div id="app" class="wrap" aria-live="polite"></div>
<script>
const app = document.getElementById("app");
let S = null;          // state from the server
let selected = null;   // selected week id
let editing = {};      // owner edit panels: { "<date>": true }
let rateFor = {};      // owner: whose rating the scale sets, per day
let drafts = {};       // unsent reactions, kept across re-renders
let errors = {};       // last error per day
let centerTabs = true; // scroll the week chips once, not on every save
let firstView = true;
let rateState = {};    // per day: "saving" | "saved" | undefined, to show that a tap was stored  // the first time the menu is shown: open at today's dish
if ("scrollRestoration" in history) history.scrollRestoration = "manual"; // we place the page ourselves

const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const DAYS = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const d = (iso) => new Date(iso + "T12:00:00");
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const longDate = (iso) => `${cap(DAYS[d(iso).getDay()])} ${d(iso).getDate()} ${MONTHS[d(iso).getMonth()]}`;
const shortRange = (w) => {
  const a = d(w.id), b = d(plus6(w.id)); // always Friday to Thursday
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()} ${MONTHS[a.getMonth()].slice(0,3)}`
    : `${a.getDate()} ${MONTHS[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MONTHS[b.getMonth()].slice(0,3)}`;
};
const nl = (n) => String(Math.round(n * 10) / 10).replace(".", ",");
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};

async function api(path, body) {
  const r = await fetch("/api/menu/" + path, body === undefined
    ? { credentials: "same-origin" }
    : { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json", "x-menu": "1" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || "Er ging iets mis (" + r.status + ")"), { status: r.status });
  return data;
}

async function load() {
  try {
    S = await api("state");
    if (!selected || !S.weeks.some((w) => w.week?.id === selected))
      selected = (S.weeks.find((w) => w.week && phase(w.week) === "now") ?? S.weeks.at(-1))?.week?.id ?? null; // this week first
    render();
  } catch (e) {
    if (e.status === 401) renderLogin();
    else app.replaceChildren(el("p", { class: "err" }, e.message));
  }
}

// ---------- login: names under each other, PIN next to your name ----------
async function renderLogin() {
  let people = [], withPin = [];
  try { ({ people, pin: withPin = [] } = await api("people")); } catch {}
  const error = el("p", { class: "err", role: "alert" });
  const login = async (name, input) => {
    error.textContent = "";
    try { await api("login", { name, pin: input?.value ?? "" }); firstView = true; await load(); }
    catch (e) { error.textContent = `${name}: ${e.message}`; if (input) { input.value = ""; input.focus(); } }
  };
  // Tap your name; only the owner also types a PIN.
  const rows = people.map((name) => {
    if (!withPin.includes(name)) return el("button", { type: "button", class: "who-row who-btn", onclick: () => login(name) }, el("span", {}, name), el("span", { class: "go", "aria-hidden": "true" }, "→"));
    const id = "pin-" + name.toLowerCase();
    const input = el("input", { id, type: "password", inputmode: "numeric", autocomplete: "off", maxlength: "8", placeholder: "pincode", "aria-label": "Pincode " + name });
    input.addEventListener("input", () => { if (/^\d{4}$/.test(input.value)) login(name, input); });
    input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") login(name, input); });
    return el("div", { class: "who-row" }, el("label", { for: id }, name), input);
  });
  app.replaceChildren(el("div", { class: "login" }, el("div", { class: "card" },
    el("h1", {}, "Ons menu"), el("p", { class: "sub" }, "Tik op je naam"), el("div", { class: "ornament" }),
    el("div", { class: "who-list", style: "margin-top:14px" }, rows), error,
    el("button", { class: "btn ghost guest-btn", onclick: async () => { try { await api("guest", {}); firstView = true; await load(); } catch (e) { error.textContent = e.message; } } }, "Doorgaan als gast"))));
}

// ---------- the menu ----------
const plus6 = (iso) => { const x = d(iso); x.setDate(x.getDate() + 6); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const phase = (w) => (plus6(w.id) < S.today ? "past" : w.id > S.today ? "next" : "now");
function render() {
  const header = el("header", {},
    el("h1", {}, "Ons menu"),
    el("span", { class: "who" }, S.me, "  ", el("button", { class: "link", onclick: async () => { await api("logout", {}); S = null; renderLogin(); } }, "Uitloggen")));
  if (!S.weeks.length) {
    app.replaceChildren(header, el("div", { class: "card" }, el("p", { class: "empty-state" }, "Er staat nog geen menu klaar. Het nieuwe voorstel verschijnt donderdag.")));
    return;
  }
  const tabs = el("nav", { class: "weeks", "aria-label": "Weken" },
    S.weeks.map(({ week }) => el("button", { class: phase(week), title: { past: "Geweest", now: "Deze week", next: "Komt nog" }[phase(week)], "aria-pressed": String(week.id === selected), onclick: () => { selected = week.id; editing = {}; rateFor = {}; errors = {}; render(); } }, shortRange(week))));
  const W = S.weeks.find((w) => w.week.id === selected);
  const future = W.week.days[0] && W.week.days[0].date > S.today;
  const card = el("section", { class: "card" },
    el("h2", {}, W.week.title),
    el("p", { class: "sub" }, phase(W.week) === "past" ? "" : cap(W.week.status || (future ? "voorstel" : ""))),
    el("div", { class: "ornament" }),
    S.isGuest && el("p", { class: "quota", style: "margin-top:14px" }, S.guestLeft ? `Je kunt vandaag nog ${S.guestLeft} ${S.guestLeft === 1 ? "cijfer" : "cijfers"} geven` : "Je hebt vandaag je cijfers al gegeven"),
    W.week.days.map((day) => renderDay(W, day)),
    renderGroceries(W),
    renderWeekComment(W));
  const anchor = firstView ? null : scrollAnchor();
  app.replaceChildren(header, tabs, card);
  if (firstView) { firstView = false; scrollToToday(); }
  else keepAnchor(anchor); // stay where you were after a save or change, even if something above grew or shrank
  if (centerTabs) {
    centerTabs = false;
    const b = tabs.querySelector('[aria-pressed="true"]');
    if (b) tabs.scrollLeft = b.offsetLeft - (tabs.clientWidth - b.offsetWidth) / 2;
  }
}

// Keep the page still on re-render: remember which block is at the top of the screen and put it back at the same spot.
function scrollAnchor() {
  const y = window.scrollY;
  for (const n of app.querySelectorAll("[data-anchor]")) {
    const r = n.getBoundingClientRect();
    if (r.bottom > 0) return { key: n.dataset.anchor, top: r.top, y };
  }
  return { key: null, top: 0, y };
}
function keepAnchor(a) {
  const n = a.key && app.querySelector(`[data-anchor="${a.key}"]`);
  if (n) window.scrollBy(0, n.getBoundingClientRect().top - a.top);
  else window.scrollTo(0, a.y);
}
function scrollToToday() {
  const n = app.querySelector(`[data-anchor="${S.today}"]`);
  if (n) window.scrollTo(0, Math.max(0, n.getBoundingClientRect().top + window.scrollY - 8));
}

function renderDay(W, day) {
  const { week, feedback, guest } = W;
  const eaten = day.date <= S.today;
  const hasMeal = day.dish && !day.away;
  const items = S.people.map((p) => [p, feedback[p]?.items?.[day.date]]);
  const guestList = guest?.items?.[day.date] ?? [];
  const ownGuest = S.isGuest ? guestList.find((g) => g.mine) : null;
  const target = S.isOwner ? rateFor[day.date] ?? S.me : S.me; // the owner can rate for someone else

  let scores = null, avg = null, scale = null;
  if (hasMeal && eaten) {
    const cells = items.map(([p, i]) => {
      const kids = [el("small", {}, p), el("span", { class: i?.rating ? "" : "none" }, i?.rating ?? "–")];
      return S.isOwner
        ? el("button", { type: "button", class: "cell" + (p === target ? " sel" : ""), "aria-pressed": String(p === target), title: "Cijfer van " + p + " invullen",
            onclick: () => { rateFor[day.date] = p; render(); } }, kids)
        : el("div", { class: "cell" + (p === S.me ? " sel" : "") }, kids);
    });
    const gAvg = guestList.length ? guestList.reduce((a, g) => a + g.rating, 0) / guestList.length : null;
    if (gAvg !== null) cells.push(el("div", { class: "cell guest" + (ownGuest ? " sel" : "") }, el("small", {}, guestList.length > 1 ? `Gast (${guestList.length}×)` : "Gast"), el("span", {}, nl(gAvg))));
    scores = el("div", { class: "scores" }, cells);
    const all = [...items.map(([, i]) => i?.rating).filter(Boolean), ...guestList.map((g) => g.rating)];
    if (all.length > 1) avg = el("p", { class: "avg" }, "Gemiddeld " + nl(all.reduce((a, b) => a + b, 0) / all.length));
    if (!S.isGuest || ownGuest || S.guestLeft) {
      const current = S.isGuest ? ownGuest?.rating ?? null : feedback[target]?.items?.[day.date]?.rating ?? null;
      const label = S.isGuest || target === S.me ? "Jouw cijfer" : "Cijfer van " + target;
      scale = el("div", { class: "mine" },
        el("p", { class: "for" }, label,
          rateState[day.date] === "saving" ? el("span", { class: "rs" }, " · opslaan…")
          : rateState[day.date] === "saved" ? el("span", { class: "rs ok" }, " · ✓ opgeslagen") : null),
        el("div", { class: "rating", role: "group", "aria-label": label },
          Array.from({ length: 10 }, (_, i) => el("button", { type: "button", "aria-pressed": String(current === i + 1),
            onclick: () => setRating(W, day, target, current === i + 1 && !S.isGuest ? null : i + 1) }, i + 1))));
    }
  }
  // Everyone's reactions, right under the dish (your own too).
  const notes = [
    ...items.filter(([, i]) => i?.comment).map(([p, i]) => el("li", {}, el("b", {}, p), i.comment)),
    ...guestList.filter((g) => g.comment).map((g) => el("li", {}, el("b", {}, g.mine ? "Gast (jij)" : "Gast"), g.comment)),
  ];

  return el("article", { class: "day", "data-anchor": day.date },
    el("div", { class: "dayname" }, longDate(day.date)),
    el("div", { class: "dish" + (hasMeal ? "" : " empty") }, day.away ? "Niet thuis" : day.dish || "Nog niet ingevuld"),
    day.notes && el("p", { class: "notes" }, day.notes),
    day.claudeNote && el("p", { class: "cnote" }, day.claudeNote),
    day.editedBy === "owner" && el("span", { class: "owner-mark" }, "Aangepast door " + S.owner),
    (day.ingredients || day.picnic) && el("details", { class: "ingr" }, el("summary", {}, "Ingrediënten"),
      day.ingredients && el("p", {}, day.ingredients), day.picnic && el("p", { class: "muted" }, day.picnic)),
    (day.recipeUrl || S.isOwner) && el("div", { class: "meta" },
      day.recipeUrl && el("a", { href: day.recipeUrl, target: "_blank", rel: "noopener" }, "Recept"),
      S.isOwner && el("button", { "aria-expanded": String(!!editing[day.date]), onclick: () => { editing[day.date] = !editing[day.date]; render(); } }, "Aanpassen")),
    editing[day.date] && renderEdit(week, day),
    notes.length ? el("ul", { class: "notes-list" }, notes) : null,
    scores, avg, scale,
    hasMeal && renderComment(W, day.date, eaten, ownGuest),
    errors[day.date] && el("p", { class: "err", role: "alert" }, errors[day.date]));
}

// Ratings save on tap. Taps are sent one after the other; only the last one counts.
const pendingRating = {}, sendingRating = {}, rateTimer = {};
function setRating(W, day, person, rating) {
  errors[day.date] = "";
  if (S.isGuest) {
    const list = (W.guest.items[day.date] ??= []);
    const own = list.find((g) => g.mine);
    if (own) own.rating = rating;
    else { list.push({ rating, comment: "", mine: true }); S.guestLeft = Math.max(0, S.guestLeft - 1); }
  } else {
    const f = (W.feedback[person] ??= { person, items: {} });
    const it = f.items[day.date];
    if (rating === null && !it?.comment) delete f.items[day.date];
    else f.items[day.date] = { ...(it ?? { comment: "" }), rating };
  }
  rateState[day.date] = "saving";
  render();
  const key = W.week.id + day.date + person;
  pendingRating[key] = { weekId: W.week.id, date: day.date, person, rating };
  if (!sendingRating[key]) flushRating(W, key);
}
async function flushRating(W, key) {
  sendingRating[key] = true;
  while (pendingRating[key]) {
    const body = pendingRating[key];
    delete pendingRating[key];
    try {
      const r = await api("rating", body);
      if (S.isGuest && !pendingRating[key]) { W.guest = r.guest; S.guestLeft = r.guestLeft; }
      if (!pendingRating[key]) {
        rateState[body.date] = "saved";
        render();
        clearTimeout(rateTimer[body.date]);
        rateTimer[body.date] = setTimeout(() => { if (rateState[body.date] === "saved") { delete rateState[body.date]; render(); } }, 2500);
      }
    } catch (e) {
      errors[body.date] = e.message;
      delete rateState[body.date];
      await load(); // show what is really saved
    }
  }
  sendingRating[key] = false;
}

/** Your reaction: once per dish. After saving it shows up in the list and the field is gone. */
function renderComment(W, date, eaten, ownGuest) {
  if (S.isGuest) { if (!ownGuest || ownGuest.comment) return null; }
  else if (W.feedback[S.me]?.items?.[date]?.comment) return null;
  const key = W.week.id + date;
  const label = date === "week" ? "Reactie op dit menu" : eaten ? "Toelichting" : "Reactie of gewenste aanpassing";
  const box = el("textarea", { maxlength: "1000", placeholder: label, "aria-label": label }, drafts[key] || "");
  box.addEventListener("input", () => { drafts[key] = box.value; });
  const status = el("span", { role: "status" });
  return el("div", { class: "mine" }, box,
    el("div", { class: "row" },
      el("button", { class: "btn", onclick: async () => {
        status.className = ""; status.textContent = "";
        if (!box.value.trim()) { status.className = "err"; status.textContent = "Schrijf eerst iets"; return; }
        try {
          const r = await api("comment", { weekId: W.week.id, date, comment: box.value });
          if (S.isGuest) W.guest = r.guest;
          else { const f = (W.feedback[S.me] ??= { person: S.me, items: {} }); f.items[date] = { ...(f.items[date] ?? { rating: null }), comment: r.item.comment }; }
          delete drafts[key];
          render();
        } catch (e) { status.className = "err"; status.textContent = e.message; } } }, "Opslaan"),
      el("span", { class: "hint" }, "Je kunt één keer reageren"), status));
}

// ---------- standard groceries: planned by Claude, suggestions from the family, approved by the owner ----------
const ORDER = { voorstel: 0, gepland: 1, goedgekeurd: 1, afgewezen: 2 };
function renderGroceries(W) {
  if (!W.groceries) return null;
  const open = (W.week.days[0]?.date || W.week.id) > S.today; // the week hasn't started: still changeable
  const status = el("p", { class: "err", role: "status" });
  const act = async (id, action) => {
    status.textContent = "";
    try { W.groceries = (await api("grocery-status", { id, action })).groceries; render(); }
    catch (e) { status.textContent = e.message; }
  };
  const euro = (n) => "€" + n.toFixed(2).replace(".", ",");
  const rows = [...W.groceries].sort((a, b) => ORDER[a.status] - ORDER[b.status]).map((g) => {
    const acts = [];
    if (open && S.isOwner) {
      if (g.status === "voorstel") acts.push(el("button", { class: "yes", onclick: () => act(g.id, "goedgekeurd") }, "Goedkeuren"), el("button", { onclick: () => act(g.id, "afgewezen") }, "Afkeuren"));
      else if (g.status === "afgewezen") acts.push(el("button", { onclick: () => act(g.id, g.by === "Claude" ? "gepland" : "goedgekeurd") }, "Terugzetten"));
      else acts.push(el("button", { "aria-label": "Eruit: " + g.product, onclick: () => act(g.id, "afgewezen") }, "Eruit"));
    } else if (open && g.status === "voorstel" && g.by === S.me) {
      acts.push(el("button", { onclick: () => act(g.id, "remove") }, "Intrekken"));
    }
    const family = g.by && g.by !== "Claude" && g.by !== S.owner;
    const tag = g.status === "voorstel" ? `voorstel ${g.by} · wacht op ${S.owner}`
      : g.status === "goedgekeurd" && family ? `voorstel ${g.by} · goedgekeurd`
      : g.status === "goedgekeurd" && g.by === S.owner ? `toegevoegd door ${S.owner}`
      : g.status === "afgewezen" && family ? `voorstel ${g.by} · afgekeurd`
      : g.status === "afgewezen" ? "eruit gehaald" : "";
    const detail = [g.picnic, g.price != null ? euro(g.price) : null].filter(Boolean).join(" · ");
    return el("li", { class: g.status === "afgewezen" ? "no" : "" },
      el("div", { class: "top" },
        el("span", { class: "n" }, g.product), g.amount ? el("span", { class: "amt" }, g.amount + "×") : null,
        acts.length ? el("span", { class: "acts" }, acts) : null),
      detail && el("div", { class: "pp" }, detail),
      tag && el("div", { class: "tag" }, tag));
  });
  let form = null;
  if (open && !S.isGuest) {
    const product = el("input", { type: "text", maxlength: "120", placeholder: "Product", "aria-label": "Product" });
    const amount = el("input", { type: "text", inputmode: "numeric", maxlength: "2", placeholder: "Aantal", "aria-label": "Aantal" });
    form = el("form", { onsubmit: async (ev) => {
      ev.preventDefault(); status.textContent = "";
      if (!product.value.trim()) return;
      try { W.groceries = (await api("grocery", { weekId: W.week.id, product: product.value, amount: amount.value || null })).groceries; render(); }
      catch (e) { status.textContent = e.message; } } },
      product, amount, el("button", { class: "btn", type: "submit" }, S.isOwner ? "Toevoegen" : "Voorstellen"));
  }
  return el("div", { class: "wkc groc", "data-anchor": "groceries" },
    el("h3", {}, "Standaard boodschappen"),
    rows.length ? el("ul", {}, rows) : el("p", { class: "muted", style: "text-align:center;margin:0" }, "Nog geen boodschappen gepland."),
    form, status,
    open && !S.isOwner && !S.isGuest && el("p", { class: "muted", style: "text-align:center;font-size:.85rem;margin:8px 0 0" }, `${S.owner} keurt voorstellen goed.`));
}

function renderEdit(week, day) {
  const f = (id, label, value, multi) => [el("label", { class: "f", for: id }, label),
    multi ? el("textarea", { id }, value || "") : el("input", { type: id === "e-url" ? "url" : "text", id, value: value || "" })];
  const away = el("input", { type: "checkbox", id: "e-away", checked: !!day.away });
  const status = el("span", { role: "status" });
  const panel = el("div", { class: "panel" },
    f("e-dish", "Gerecht", day.dish), f("e-ingr", "Ingrediënten", day.ingredients, true),
    f("e-notes", "Bijzonderheden", day.notes), f("e-url", "Receptlink", day.recipeUrl),
    el("label", { class: "check" }, away, "Niet thuis eten"),
    el("div", { class: "row" },
      el("button", { class: "btn", onclick: async () => {
        const v = (id) => panel.querySelector("#" + id).value;
        try { await api("day", { weekId: week.id, day: { date: day.date, dish: v("e-dish"), ingredients: v("e-ingr"), notes: v("e-notes"), recipeUrl: v("e-url"), away: away.checked } });
          editing[day.date] = false; await load(); }
        catch (e) { status.className = "err"; status.textContent = e.message; } } }, "Opslaan"),
      el("button", { class: "btn ghost", onclick: () => { editing[day.date] = false; render(); } }, "Annuleren"),
      status));
  return panel;
}

function renderWeekComment(W) {
  const firstDay = W.week.days[0]?.date || W.week.id;
  if (firstDay <= S.today || S.isGuest) return null; // reactions on the menu as a whole: only for the proposal
  const list = S.people.filter((p) => W.feedback[p]?.items?.week?.comment).map((p) => el("li", {}, el("b", {}, p), W.feedback[p].items.week.comment));
  return el("div", { class: "wkc", "data-anchor": "week-comment" },
    el("h3", {}, "Reacties op dit menu"),
    list.length ? el("ul", { class: "notes-list" }, list) : null,
    renderComment(W, "week", false, null));
}

load();
</script>
